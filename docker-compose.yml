version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      - VITE_API_URL=http://localhost:3001
    networks:
      - resume-network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - uploads:/app/uploads
    environment:
      - NODE_ENV=production
      - PARSER_SERVICE_URL=http://parser:8000
    depends_on:
      - parser
    networks:
      - resume-network

  parser:
    build:
      context: ./parse-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - resume-network

  renderer:
    build:
      context: ./renderer
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    # Puppeteer needs shared memory
    shm_size: '2gb'
    environment:
      - NODE_ENV=production
    networks:
      - resume-network

volumes:
  uploads:
    driver: local

networks:
  resume-network:
    driver: bridge

